name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lockfile and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install locked dependencies (Python 3.12 from .python-version)
        run: uv sync --frozen
      - name: Run the offline test suite (no API key, no Ollama, no model download)
        run: uv run pytest -q

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t helpdesk-rag:ci .
      - name: Start a container and check that the index is ready
        run: |
          docker run -d --name app -p 8000:8000 -e LLM_PROVIDER=ollama helpdesk-rag:ci
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 2; done
          echo
          curl -sf localhost:8000/health | grep -q '"index_ready":true'
      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -20 || true
