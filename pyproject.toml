[project]
name = "helpdesk-rag"
version = "0.1.0"
description = "IT helpdesk knowledge-base Q&A backend (FastAPI + LangGraph RAG, Claude or local Ollama)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.2",
    "langgraph>=1.2.20",
    "anthropic>=2.8.0",
    "ollama>=0.6.3",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "httpx>=0.28.1",  # imported directly by the Ollama adapter (timeout/HTTP error types)
]

[project.scripts]
helpdesk-rag-ingest = "helpdesk_rag.ingest:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx2",  # tests build anthropic SDK request/response objects
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: talks to a real LLM provider (Claude API or a running Ollama); deselected by default",
]
